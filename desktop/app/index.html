<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  No remote content, ever: everything this application draws it
  ships with. The policy says so rather than leaving it to
  nobody having written a `fetch` yet. [T-1]

  `take-capture:` IS NOT AN EXCEPTION TO THAT. It is a scheme
  the MAIN PROCESS answers, out of this machine's own capture
  directory, so REVIEW can play back what was recorded without
  the window gaining a filesystem — and `connect-src` stays
  'none', so the page still cannot ask it, or anything else,
  for anything. A `<video>` may play it; `fetch` may not reach
  it. [T-5]
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';
               img-src 'self' data: blob:;
               media-src 'self' blob: take-capture:;
               connect-src 'none'">
<title>Take</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!--
  AN IDENT, AND IT IS STATIC MARKUP ON PURPOSE.  [T-1]

  The window opened straight onto a centred wordmark above a
  wizard, so Take Desktop looked like a different product from
  the Take App and BalanceVid TV — both of which gained a mark,
  a name and a line saying what they are. This is the same
  three, and it sits OUTSIDE `#app` because the renderer
  replaces that element's contents on every screen: a header
  the renderer had to redraw is a header that flickers between
  CONNECT and CAMERAS, and one each screen builds for itself is
  four copies of it.
-->
  <header class="ident">
    <span class="ident-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path>
      </svg>
    </span>
    <span class="ident-said">
      <span class="ident-name">Take</span>
      <span class="ident-says">Capture station</span>
    </span>
  </header>
  <main id="app"></main>
  <script type="module" src="renderer.js"></script>
</body>
</html>

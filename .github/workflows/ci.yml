# What must be true before anything reaches the trunk.  [Doctrine D-19, D-20]
#
# The repository had one branch and no checks: every commit this product has
# ever had went straight onto the line it deploys from, and the only thing
# standing between a broken build and production was whoever happened to run
# `npm test` locally. A trunk with nothing guarding it is a naming convention,
# not a process — so the trunk and this file arrive together.
#
# CHEAPEST FIRST, IN PARALLEL. A type error should be reported in two minutes,
# not discovered at the end of a nine-minute render suite. So the fast checks
# and the slow ones are separate jobs that start at the same time: whichever
# fails, fails while the other is still going, and the report names which.
#
# NOTHING HERE IS INSTALLED FROM THE SYSTEM. ffmpeg and ffprobe come from npm
# (`ffmpeg-static`, `ffprobe-static`), which is what the worker uses in
# production too — a CI runner encoding with a different ffmpeg than the
# deployment would be testing the wrong binary. Chromium is the one exception
# and Playwright fetches its own.
#
# WHAT IS NOT COVERED, said plainly rather than left to be discovered:
# LibreOffice is not installed here, so the office-conversion path is not
# exercised. That is honest rather than lazy — `WITH_OFFICE=0` is the build
# default, so production does not have it either, and `deck.test.ts` covers
# the refusal that a build without it is supposed to give.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- the two-minute answer ---------------------------------------------
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `ci` and not `install`: the lockfile is the statement of what was
      # tested, and a run that quietly resolved a different tree is a run
      # that proves nothing about the commit.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ---- the whole suite ----------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    # The frame-exactness tests really do render video, and they are the
    # reason INV-02 is a claim this product can make rather than an intention.
    # They take minutes. That is the cost of testing the thing itself instead
    # of a mock of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Slide rendering and page capture launch a real browser. `--with-deps`
      # brings the shared libraries a headless Chromium needs on a bare
      # runner; without them the launch fails with a linker error that reads
      # like a code fault.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

  # ---- the image, started as each of the things it claims to be ----------
  #
  # THE CHECK THIS PRODUCT SHIPPED A PRODUCTION OUTAGE WITHOUT.
  #
  # Three `src/domain/` modules are doors: `export * from
  # '../../shared/src/…'`. The runtime stage copied `src`, `app` and
  # `scripts` and not `shared`, and NOTHING NOTICED — because Next resolves
  # those doors at build time and bundles what is behind them, so the web
  # tier comes up perfectly on an image that cannot run either of the other
  # two roles:
  #
  #     Error [ERR_MODULE_NOT_FOUND]: Cannot find module
  #     '/app/shared/src/time.js' imported from /app/src/domain/time.ts
  #
  # Typecheck passed. Four thousand three hundred tests passed. The image
  # built. The site answered. Online TV transmitted nothing and no song ever
  # finished preparing, and on a split deployment the only visible symptom
  # was two worker services restarting out of sight.
  #
  # EVERY TEST ABOVE RUNS IN A CHECKOUT, where `shared/` is simply there.
  # The only thing that can catch a file missing from the IMAGE is starting
  # the image, so that is what this does — as each role that has to run on
  # its own, which on a split deployment is all of them.
  roles:
    name: The image runs as each role
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        # The defaults, which is what a deployment gets. No browser: it adds
        # minutes and a Chromium download to a check about module
        # resolution, and nothing here opens a page.
        run: docker build --build-arg WITH_BROWSER=0 -t balancevid:ci .

      # `ensure_models` fetches ~600 MB on a worker's first boot and this
      # check is not about that. One file with the name it looks for makes
      # it return immediately — see `ensure_models` in `scripts/serve.sh`.
      - name: Stand in for the speech models
        run: mkdir -p ci-models && touch ci-models/silero_vad.onnx

      - name: Start as each role, and see that it survives
        run: |
          set -u
          fail=0
          for role in web worker playout; do
            echo "::group::ROLE=$role"
            name="bv-$role"
            docker run -d --name "$name" \
              -e ROLE="$role" \
              -e BALANCEVID_PASSWORD=ci-only-not-a-secret \
              -e BALANCEVID_SECRET=ci-only-not-a-secret-either-but-long \
              -v "$PWD/ci-models:/models:ro" \
              balancevid:ci >/dev/null

            # Long enough for the module graph to load and the first pass to
            # start. The fault this exists for kills the process in under a
            # second, so this is generous rather than fine-tuned.
            sleep 25

            logs="$(docker logs "$name" 2>&1 || true)"
            running="$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)"
            echo "$logs" | tail -40

            if [ "$running" != "true" ]; then
              echo "::error::ROLE=$role did not stay up."
              fail=1
            fi
            # Named explicitly as well as caught by the exit: a container
            # that happens to still be up while a child is restarting is
            # still a broken image, and this is the error that put one in
            # production.
            if echo "$logs" | grep -q ERR_MODULE_NOT_FOUND; then
              echo "::error::ROLE=$role is missing a module at runtime."
              fail=1
            fi

            docker rm -f "$name" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          exit "$fail"
